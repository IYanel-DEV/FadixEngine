name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/cache@v4
        with:
          path: .build/release-cmake/_deps
          key: deps-release-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Configure CMake
        run: cmake -S . -B .build/release-cmake -DFADIX_ENABLE_PHYSICS=ON -DFADIX_PORTABLE_BUILD=ON -DFADIX_STATIC_MSVC_RUNTIME=ON

      - name: Build fadix_editor
        run: cmake --build .build/release-cmake --config Release --target fadix_editor --parallel 2

      - name: Build fadix_player
        run: cmake --build .build/release-cmake --config Release --target fadix_player --parallel 2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-binaries
          path: |
            bin/Release/fadix_editor.exe
            bin/Release/fadix_player.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-binaries

      - name: Get version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Rename binaries
        run: |
          mv fadix_editor.exe FadixEngine-${{ env.VERSION }}-Windows-x64.exe
          mv fadix_player.exe FadixPlayer-${{ env.VERSION }}-Windows-x64.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FadixEngine-${{ env.VERSION }}-Windows-x64.exe
            FadixPlayer-${{ env.VERSION }}-Windows-x64.exe
          generate_release_notes: true
