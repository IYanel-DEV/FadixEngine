name: CI

# Windows-only build + headless smoke gate. Mirrors `build.bat 1` (Debug,
# physics on, shared MSVC runtime). GPU/display smokes (gpu_pipeline, shader
# compile, export→player boot) are intentionally skipped: the runner has no
# reliable GPU/audio device.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Embedded editor assets are generated by tools/embed_assets.py at configure time.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # First configure is the slow step: every dependency is built from source
      # via FetchContent (no prebuilt packages, no cache warmed here).
      - name: Configure (Debug, physics on)
        run: >
          cmake -S . -B .build/debug-cmake
          -DFADIX_ENABLE_PHYSICS=ON
          -DFADIX_PORTABLE_BUILD=OFF
          -DFADIX_STATIC_MSVC_RUNTIME=OFF

      - name: Build editor + player
        run: |
          cmake --build .build/debug-cmake --config Debug --target fadix_editor --parallel
          cmake --build .build/debug-cmake --config Debug --target fadix_player --parallel

      - name: Build headless smokes
        run: >
          cmake --build .build/debug-cmake --config Debug --parallel
          --target fadix_project_smoke fadix_scene_persistence_smoke
          fadix_collision_smoke fadix_lua_smoke fadix_quality_smoke fadix_shadow_smoke

      - name: Run headless smokes
        run: |
          ./bin/Debug/fadix_project_smoke.exe
          ./bin/Debug/fadix_scene_persistence_smoke.exe
          ./bin/Debug/fadix_collision_smoke.exe
          ./bin/Debug/fadix_lua_smoke.exe
          ./bin/Debug/fadix_quality_smoke.exe
          ./bin/Debug/fadix_shadow_smoke.exe
